<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tax Invoice — J.C.Mittal And Sons</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans:wght@700&display=swap" rel="stylesheet" />
<style>
/* ── J.C.Mittal & Sons — GST tax invoice ─────────────────────────────────
   Self-contained, A4, print-ready (window.print() → PDF, no browser
   header/footer). Pagination: ITEMS_PER_PAGE line items per sheet;
   masthead + footer repeat on every page; earlier pages show
   "Carried forward", later pages "Brought forward"; the GST breakup,
   totals, terms and bank block print ONLY on the last page. Pages are a
   fixed 210×297mm box, so short invoices leave clean blank space rather
   than stretching.

   Data: normally injected via window.__INVOICE__ (set by
   api/invoice-pdf.js before this page is loaded in a headless browser).
   The INVOICE constant below is only the fallback used when opened
   directly as a design reference.
   Money: prices are GST-INCLUSIVE (as in the ERP). discount is a PERCENT
   off list price — price = rate × (1 − discount/100); amount = qty × price;
   taxable = amount / (1 + rate/100). Intra-state → CGST+SGST (half each);
   inter-state → set INVOICE.interState = true for a single IGST column.
── ────────────────────────────────────────────────────────────────────── */
:root{
  --ink:#14161c; --body:#4b5060; --muted:#6d7280; --faint:#9aa0ad;
  --line:#e5e7ee; --hair:#eceef3; --accent:#2f3f8f; --accent-soft:#eef0f9;
  --sans:'Instrument Sans','Noto Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
  --cols:24px minmax(0,1fr) 54px 44px 52px 60px 50px 32px 62px 76px;
}
*{box-sizing:border-box}
body{margin:0;background:#f2f3f6;color:var(--ink);font-family:var(--sans);
  -webkit-print-color-adjust:exact;print-color-adjust:exact}
a{color:var(--accent);text-decoration:none}
a:hover{color:#1d2a66}

/* Portal chrome — screen only */
.portal-bar{display:flex;justify-content:space-between;align-items:center;gap:16px;
  flex-wrap:wrap;max-width:210mm;margin:0 auto;padding:18px 6px 10px}
.portal-title{font-size:14px;font-weight:600}
.pill{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:20px}
.pill-paid{color:#0f7a52;background:#e6f4ee}
.pill-due{color:#9a3412;background:#fdeee3}
.actions{display:flex;align-items:center;gap:8px}
.btn{font:500 12px/1 var(--sans);color:var(--ink);background:#fff;border:1px solid #d7dae2;
  border-radius:8px;padding:10px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f4f5f8}
.btn-primary{color:#fff;background:var(--accent);border-color:var(--accent);font-weight:600;padding:10px 16px}
.btn-primary:hover{background:#25327a}

/* A4 sheet */
.page{width:210mm;height:297mm;margin:0 auto 20px;background:#fff;padding:13mm;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 1px 3px rgba(20,22,28,.10),0 12px 32px rgba(20,22,28,.07)}
.grow{flex:1 1 auto;min-height:14px}

.head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex:none}
.lockup{display:flex;align-items:center;gap:13px}
.logo{width:46px;height:46px;border-radius:8px;object-fit:contain;flex:none;background:#f2f3f6}
.co-name{font-size:23px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.co-gstin{font-family:var(--mono);font-size:9px;letter-spacing:.04em;color:var(--muted);margin-top:2px}
.co-contact{text-align:right;font-size:9px;color:var(--muted);line-height:1.5}

.title-row{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-top:16px;flex:none}
.title-left{display:flex;align-items:baseline;gap:10px}
h1{font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1;margin:0}
.copy-mark{font-size:8.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:20px;white-space:nowrap}
.doc-no-label{font-size:8.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.doc-no{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.01em;color:var(--accent);line-height:1.2}
.doc-date{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px}

.parties{display:grid;grid-template-columns:1fr 1fr 1fr;gap:22px;margin-top:12px;
  padding-top:12px;border-top:1px solid var(--line);flex:none}
.eyebrow{font-size:8.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:7px}
.party-name{font-size:13px;font-weight:600}
.party-addr{font-size:10.5px;color:var(--body);line-height:1.55;margin-top:3px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:10.5px;line-height:1.4}
.kv .k{color:var(--muted);white-space:nowrap}
.mono{font-family:var(--mono)}
.nil{color:var(--faint)}

/* Item list — CSS grid, not a table: rows never split across pages */
.items{margin-top:14px;font-variant-numeric:tabular-nums;flex:none}
.irow{display:grid;grid-template-columns:var(--cols);column-gap:9px}
.ihead{padding-bottom:7px;border-bottom:1px solid var(--ink)}
.ihead>div{font-size:8.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.iline{padding:4px 0;border-bottom:1px solid var(--hair);align-items:start}
.iline .sr{font-size:10px;color:var(--faint)}
.iline .desc{font-size:11px}
.iline .note{font-size:9.5px;color:var(--muted)}
.iline .code{font-size:9.5px;font-family:var(--mono);color:var(--muted)}
.iline .num{font-size:10.5px;text-align:right;color:var(--body)}
.iline .qty{color:var(--ink)}
.iline .amt{font-size:11px;text-align:right;font-weight:600}
.r{text-align:right}
.carry{display:flex;justify-content:space-between;gap:12px;padding:8px 0 0;font-weight:600}
.carry .lbl{font-size:10px}
.carry .val{font-size:12px;font-weight:700}
.brought{display:flex;justify-content:space-between;gap:12px;padding:6px 0;
  border-bottom:1px solid var(--hair);color:var(--muted);font-weight:600}
.brought .lbl{font-size:10px}
.brought .val{font-size:11px}

/* Closing blocks — last page only */
.totals{display:grid;grid-template-columns:1fr 260px;gap:30px;padding-top:12px;border-top:1px solid var(--line)}
.gst{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.gst th{font-size:8.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--faint);text-align:right;padding:0 4px 5px;border-bottom:1px solid var(--line)}
.gst th:first-child{text-align:left}
.gst td{padding:7px 4px;font-size:10.5px;text-align:right}
.gst td:first-child{text-align:left}
.words{margin-top:14px}
.words-val{font-size:12px;font-weight:600;margin-top:3px}
.sum{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:10.5px;color:var(--body);font-variant-numeric:tabular-nums}
.sum .v{text-align:right;color:var(--ink)}
.grand{display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  margin-top:10px;padding-top:10px;border-top:1px solid var(--ink)}
.grand-label{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--body)}
.grand-val{font-size:20px;font-weight:700;letter-spacing:-.02em}
.qty-note{margin-top:8px;font-size:9.5px;color:var(--muted)}
.foot-cols{display:grid;grid-template-columns:1.15fr 1fr;gap:30px;margin-top:16px;
  padding-top:12px;border-top:1px solid var(--line)}
.terms{margin:0;padding-left:15px;font-size:9.5px;color:var(--body);line-height:1.6}
.care{display:flex;align-items:baseline;gap:9px;margin-top:12px;padding:7px 11px;
  background:var(--accent-soft);border-radius:8px}
.care-label{font-size:8.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);white-space:nowrap}
.care-no{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--accent)}
.sheet-foot{display:flex;justify-content:space-between;gap:16px;margin-top:14px;padding-top:8px;
  border-top:1px solid var(--line);font-size:8px;color:var(--faint);white-space:nowrap;flex:none}

@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  .portal-bar,.no-print{display:none!important}
  .page{margin:0;box-shadow:none;break-after:page}
  .page:last-child{break-after:auto}
}
</style>
</head>
<body>

<div class="portal-bar">
  <div style="display:flex;align-items:baseline;gap:10px">
    <span class="portal-title" id="portal-invoice-no"></span>
    <span class="pill pill-paid" id="portal-status"></span>
  </div>
  <div class="actions">
    <button type="button" class="btn" onclick="window.print()">Print</button>
    <a class="btn" id="pdf-link" href="#" download>Download PDF</a>
  </div>
</div>

<main id="invoice"></main>

<script>
/* ── Fallback demo data (only used when window.__INVOICE__ isn't set) ──── */
const ITEMS_PER_PAGE = 15;

const DEMO_INVOICE = {
  seller: {
    name: "J.C.Mittal And Sons",
    gstin: "23AAPFJ0607D1ZT",
    address: "87-88, Freeganj Road, Ratlam, MP 457001",
    contact: "07412 490490 · 910910-8258 · jcmretails@gmail.com",
    website: "www.jcmretails.com",
    logo: "/jcm-logo.png",
    customerCare: "910 910 8258"
  },
  bank: { name: "State Bank of India", account: "38596845721", ifsc: "SBIN0009452", branch: "SME Branch, Ratlam" },
  no: "LNT/2627/9271",
  date: "15-08-2026",
  copyMark: "Digital Invoice",
  status: "",
  interState: false,
  buyer: {
    name: "S.S. Jadav Electricals (Badnawar)",
    address: ["Bus Stand", "Badnawar, Madhya Pradesh"],
    mobile: "9977011755",
    gstin: "23BBLPJ2574D1ZV"
  },
  supply: { placeOfSupply: "Madhya Pradesh (23)", transport: "Transport", station: "Badnawar", reverseCharge: "No", challan: "", reference: "" },
  eInvoice: { irn: "", ackNo: "", ackDate: "" },
  generated: { at: "20-08-2026 22:41", by: "" },
  payUrl: "#", pdfUrl: "#",
  terms: [
    "Installation charges are not included in this invoice.",
    "No return policy.",
    "Interest at 18% p.a. on delayed payments.",
    "Not responsible for damage or loss in transit.",
    "Service claims are handled by the respective service centre.",
    "Subject to Ratlam jurisdiction only."
  ],
  items: [
    { desc: "Tripper MCB 32A SP 6KA (C Curve)", note: "", hsn: "85362030", code: "1753", qty: 24, unit: "Pcs", rate: 246, discount: 40.5, gst: 18 },
    { desc: "enGem White Switch 6A 1Way", note: "", hsn: "85365020", code: "11353", qty: 100, unit: "Pcs", rate: 24, discount: 0, gst: 18 }
  ]
};

const INVOICE = window.__INVOICE__ || DEMO_INVOICE;

/* ── Helpers ─────────────────────────────────────────────────────────── */
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const inr = n => {
  const [i, d] = Math.abs(n).toFixed(2).split(".");
  const last3 = i.slice(-3), rest = i.slice(0, -3);
  return (n < 0 ? "-" : "") + (rest ? rest.replace(/\B(?=(\d{2})+(?!\d))/g, ",") + "," + last3 : last3) + "." + d;
};
const words = n => {
  const o = ["", "One", "Two", "Three", "Four", "Five", "Six", "Seven", "Eight", "Nine", "Ten", "Eleven", "Twelve", "Thirteen", "Fourteen", "Fifteen", "Sixteen", "Seventeen", "Eighteen", "Nineteen"];
  const t = ["", "", "Twenty", "Thirty", "Forty", "Fifty", "Sixty", "Seventy", "Eighty", "Ninety"];
  const two = v => v < 20 ? o[v] : t[(v / 10) | 0] + (v % 10 ? " " + o[v % 10] : "");
  const three = v => v >= 100 ? o[(v / 100) | 0] + " Hundred" + (v % 100 ? " " + two(v % 100) : "") : two(v);
  let v = Math.round(n); if (!v) return "Rupees Zero Only";
  const parts = [];
  [[1e7, "Crore"], [1e5, "Lakh"], [1e3, "Thousand"]].forEach(([d, l]) => {
    const q = Math.floor(v / d); if (q) { parts.push(three(q) + " " + l); v -= q * d; }
  });
  if (v) parts.push(three(v));
  return "Rupees " + parts.join(" ") + " Only";
};

/* ── Render ──────────────────────────────────────────────────────────── */
function render(inv) {
  const lines = inv.items.map((it, i) => {
    const net = Math.round(it.rate * (1 - (it.discount || 0) / 100) * 100) / 100; // discount is a %
    const value = it.qty * net;
    return { ...it, sr: i + 1, net, value };
  });
  const grand = lines.reduce((s, r) => s + r.value, 0);
  const totalQty = lines.reduce((s, r) => s + r.qty, 0);

  // GST breakup per rate (prices inclusive)
  const byRate = {};
  lines.forEach(r => {
    const b = byRate[r.gst] || (byRate[r.gst] = { rate: r.gst, taxable: 0, tax: 0 });
    const taxable = r.value / (1 + r.gst / 100);
    b.taxable += taxable; b.tax += r.value - taxable;
  });
  const rates = Object.values(byRate).sort((a, b) => a.rate - b.rate);
  const taxable = rates.reduce((s, r) => s + r.taxable, 0);
  const tax = rates.reduce((s, r) => s + r.tax, 0);

  const pageCount = Math.max(1, Math.ceil(lines.length / ITEMS_PER_PAGE));
  let running = 0, html = "";

  for (let p = 0; p < pageCount; p++) {
    const rows = lines.slice(p * ITEMS_PER_PAGE, (p + 1) * ITEMS_PER_PAGE);
    const brought = running;
    running += rows.reduce((s, r) => s + r.value, 0);
    const isFirst = p === 0, isLast = p === pageCount - 1;

    html += `
<section class="page">
  <header class="head">
    <div class="lockup">
      <img class="logo" src="${esc(inv.seller.logo)}" alt="${esc(inv.seller.name)}" />
      <div>
        <div class="co-name">${esc(inv.seller.name)}</div>
        <div class="co-gstin">GSTIN ${esc(inv.seller.gstin)}</div>
      </div>
    </div>
    <div class="co-contact">${esc(inv.seller.address)}<br />${esc(inv.seller.contact)}<br />${esc(inv.seller.website)}</div>
  </header>

  <div class="title-row">
    <div class="title-left"><h1>Tax Invoice</h1><span class="copy-mark">${esc(inv.copyMark)}</span></div>
    <div style="text-align:right">
      <div class="doc-no-label">Invoice no.</div>
      <div class="doc-no">${esc(inv.no)}</div>
      <div class="doc-date">Dated ${esc(inv.date)}</div>
    </div>
  </div>

  ${isFirst ? `
  <section class="parties">
    <div>
      <div class="eyebrow">Billed to</div>
      <div class="party-name">${esc(inv.buyer.name)}</div>
      <div class="party-addr">${inv.buyer.address.map(esc).join("<br />")}</div>
      <div class="mono" style="font-size:10px;color:var(--body);margin-top:6px">${esc(inv.buyer.mobile)}</div>
      ${inv.buyer.gstin ? `<div style="font-size:10px;color:var(--muted);margin-top:2px">GSTIN / UIN — ${esc(inv.buyer.gstin)}</div>` : ""}
    </div>
    <div>
      <div class="eyebrow">Supply</div>
      <div class="kv">
        <span class="k">Place of supply</span><span>${esc(inv.supply.placeOfSupply)}</span>
        <span class="k">Transport</span><span>${esc(inv.supply.transport)}</span>
        <span class="k">Station</span><span class="${inv.supply.station ? "" : "nil"}">${esc(inv.supply.station) || "—"}</span>
        <span class="k">Reverse charge</span><span>${esc(inv.supply.reverseCharge)}</span>
        ${inv.supply.challan ? `<span class="k">Challan</span><span>${esc(inv.supply.challan)}</span>` : ""}
        <span class="k">Reference</span><span class="${inv.supply.reference ? "" : "nil"}">${esc(inv.supply.reference) || "—"}</span>
      </div>
    </div>
    <div>
      <div class="eyebrow">e-Invoice</div>
      <div class="kv">
        <span class="k">IRN</span><span class="mono ${inv.eInvoice.irn ? "" : "nil"}" style="font-size:8px;word-break:break-all;line-height:1.35">${esc(inv.eInvoice.irn) || "Not generated"}</span>
        <span class="k">Ack. no.</span><span class="${inv.eInvoice.ackNo ? "" : "nil"}">${esc(inv.eInvoice.ackNo) || "—"}</span>
        <span class="k">Ack. date</span><span class="${inv.eInvoice.ackDate ? "" : "nil"}">${esc(inv.eInvoice.ackDate) || "—"}</span>
      </div>
    </div>
  </section>` : ""}

  <div class="items">
    <div class="irow ihead">
      <div>#</div><div>Item</div><div>HSN</div><div>Code</div>
      <div class="r">Qty</div><div class="r">List price</div><div class="r">Discount</div><div class="r">GST</div><div class="r">Price</div><div class="r">Amount</div>
    </div>
    ${!isFirst ? `<div class="brought"><div class="lbl">Brought forward from page ${p}</div><div class="val">${inr(brought)}</div></div>` : ""}
    ${rows.map(r => `
    <div class="irow iline">
      <div class="sr">${r.sr}</div>
      <div class="desc">${esc(r.desc)}${r.note ? `<div class="note">${esc(r.note)}</div>` : ""}</div>
      <div class="code">${esc(r.hsn)}</div>
      <div class="code">${esc(r.code)}</div>
      <div class="num qty">${r.qty} ${esc(r.unit)}</div>
      <div class="num">${inr(r.rate)}</div>
      <div class="num ${r.discount ? "" : "nil"}">${r.discount ? r.discount.toFixed(2) + "%" : "—"}</div>
      <div class="num">${r.gst}%</div>
      <div class="num" style="color:var(--ink)">${inr(r.net)}</div>
      <div class="amt">${inr(r.value)}</div>
    </div>`).join("")}
    ${!isLast ? `<div class="carry"><div class="lbl">Carried forward to page ${p + 2}</div><div class="val">${inr(running)}</div></div>` : ""}
  </div>

  <div class="grow"></div>

  ${isLast ? `
  <div>
    <section class="totals">
      <div>
        <div class="eyebrow">GST breakup — prices inclusive of tax</div>
        <table class="gst">
          <thead><tr>
            <th>Rate</th><th>Taxable value</th>
            ${inv.interState ? "<th>IGST</th>" : "<th>CGST</th><th>SGST</th>"}
            <th>Total tax</th>
          </tr></thead>
          <tbody>
            ${rates.map(r => `<tr>
              <td>${r.rate}%</td>
              <td>${inr(r.taxable)}</td>
              ${inv.interState ? `<td>${inr(r.tax)}</td>` : `<td>${inr(r.tax / 2)}</td><td>${inr(r.tax / 2)}</td>`}
              <td style="font-weight:600">${inr(r.tax)}</td>
            </tr>`).join("")}
          </tbody>
        </table>
        <div class="words">
          <div class="eyebrow" style="margin-bottom:0">Amount in words</div>
          <div class="words-val">${words(grand)}</div>
        </div>
      </div>
      <div>
        <div class="sum">
          <div>Taxable value</div><div class="v">${inr(taxable)}</div>
          ${inv.interState
            ? `<div>IGST</div><div class="v">${inr(tax)}</div>`
            : `<div>CGST</div><div class="v">${inr(tax / 2)}</div><div>SGST</div><div class="v">${inr(tax / 2)}</div>`}
          <div>Round off</div><div class="v">${(Math.round(grand) - grand >= 0 ? "+" : "") + inr(Math.round(grand) - grand)}</div>
        </div>
        <div class="grand">
          <div class="grand-label">Total</div>
          <div class="grand-val">₹${inr(Math.round(grand))}</div>
        </div>
        <div class="qty-note">${totalQty} Pcs across ${lines.length} items</div>
      </div>
    </section>

    <section class="foot-cols">
      <div>
        <div class="eyebrow">Terms</div>
        <ol class="terms">${inv.terms.map(t => `<li>${esc(t)}</li>`).join("")}</ol>
      </div>
      <div>
        <div class="eyebrow">Pay to</div>
        <div class="kv">
          <span class="k">Bank</span><span>${esc(inv.bank.name)}</span>
          <span class="k">Account no.</span><span class="mono">${esc(inv.bank.account)}</span>
          <span class="k">IFSC</span><span class="mono">${esc(inv.bank.ifsc)}</span>
          <span class="k">Branch</span><span>${esc(inv.bank.branch)}</span>
        </div>
        <div class="care">
          <span class="care-label">Customer care</span>
          <span class="care-no">${esc(inv.seller.customerCare)}</span>
        </div>
      </div>
    </section>
  </div>` : ""}

  <footer class="sheet-foot">
    <div>E. &amp; O.E. · Computer-generated invoice, valid without signature.</div>
    <div class="mono">${esc(inv.no)} · ${esc(inv.generated.at)}${inv.generated.by ? " · " + esc(inv.generated.by) : ""} · Page ${p + 1} of ${pageCount}</div>
  </footer>
</section>`;
  }

  document.getElementById("invoice").innerHTML = html;
  document.getElementById("portal-invoice-no").textContent = "Invoice " + inv.no;
  document.getElementById("portal-status").textContent = inv.status || "";
  document.getElementById("portal-status").style.display = inv.status ? "" : "none";
  document.getElementById("pdf-link").href = inv.pdfUrl;
}

render(INVOICE);
</script>
</body>
</html>
